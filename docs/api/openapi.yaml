  /me/favorites:
    get:
      tags: [Favoris]
      operationId: listFavorites
      summary: Favoris de l'utilisateur
      description: Liste complète (non paginée), triée par `id` croissant.
      security:
        - bearerAuth: []
      parameters:
        - name: updated_since
          in: query
          required: false
          x-proposal: true
          description: |
            Proposition de l'équipe mobile : ne renvoie que les favoris dont `updated_at` est strictement
            postérieur à cette date (ISO 8601), pour la synchronisation incrémentale. 422 si la date est invalide.
          schema:
            type: string
            format: date-time
          example: '2026-10-11T00:00:00Z'
      responses:
        '200':
          description: Favoris.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Favorite'
              example:
                data:
                  - id: 1
                    client_uuid: 0b9d6f3e-6c1a-4f0e-9a51-1f2d3c4b5a61
                    outfit_id: 3
                    snapshot:
                      title: Jean brut et t-shirt blanc
                      items:
                        - clothing_type_id: 1
                          color_id: 2
                          role: top
                        - clothing_type_id: 9
                          color_id: 10
                          role: bottom
                      occasion_slug: everyday
                      style_slug: casual
                      score: null
                      image_url: https://images.herycia.example/looks/thumbs/jean-brut-et-t-shirt-blanc.jpg
                      explanation: null
                    created_at: '2026-10-10T10:00:00.000Z'
                    updated_at: '2026-10-10T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Favoris]
      operationId: createFavorite
      summary: Ajouter un favori
      description: |
        Référence un look publié (`outfit_id`) et/ou fournit un instantané (`snapshot`) ; au moins l'un des deux est requis.
        Sans `snapshot`, le serveur le construit à partir du look (image : vignette si l'usage est approuvé).
        Si `snapshot` est fourni, il est conservé tel quel (pièces validées).
        Idempotent : un `client_uuid` déjà connu renvoie 200 avec le favori existant, sans modification.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteInput'
            examples:
              look:
                summary: Favori d'un look publié
                value:
                  client_uuid: 3f2c1b4a-5d6e-4f70-8a9b-0c1d2e3f4a5b
                  outfit_id: 7
              snapshot:
                summary: Favori d'une composition personnelle
                value:
                  client_uuid: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b
                  snapshot:
                    title: Ma tenue du samedi
                    items:
                      - clothing_type_id: 1
                        color_id: 2
                        role: top
                      - clothing_type_id: 9
                        color_id: 10
                        role: bottom
                    occasion_slug: everyday
                    score: 88
      responses:
        '201':
          description: Favori créé.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Favorite'
              example:
                data:
                  id: 2
                  client_uuid: 3f2c1b4a-5d6e-4f70-8a9b-0c1d2e3f4a5b
                  outfit_id: 7
                  snapshot:
                    title: Blazer marine et jean clair
                    items:
                      - clothing_type_id: 7
                        color_id: 10
                        role: top
                      - clothing_type_id: 9
                        color_id: 11
                        role: bottom
                    occasion_slug: night-out
                    style_slug: smart-casual
                    score: null
                    image_url: https://images.herycia.example/looks/thumbs/blazer-marine-et-jean-clair.jpg
                    explanation: null
                  created_at: '2026-10-12T10:00:00.000Z'
                  updated_at: '2026-10-12T10:00:00.000Z'
        '200':
          description: "Même `client_uuid` déjà enregistré : favori existant renvoyé tel quel."
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Favorite'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/favorites/{id}:
    delete:
      tags: [Favoris]
      operationId: deleteFavorite
