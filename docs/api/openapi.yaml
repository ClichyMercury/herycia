  /me/saved-outfits:
    get:
      tags: [Compositions]
      operationId: listSavedOutfits
      summary: Compositions enregistrées
      description: Liste complète (non paginée), triée par `id` croissant.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Compositions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedOutfit'
              example:
                data:
                  - id: 1
                    client_uuid: 6a1f4c2e-3b7d-4e8a-9c0b-5d6e7f8a9b0c
                    title: Entretien jeudi
                    composition:
                      items:
                        - clothing_type_id: 2
                          color_id: 11
                          role: top
                        - clothing_type_id: 8
                          color_id: 10
                          role: bottom
                      occasion_slug: work
                      style_slug: null
                    score: 93
                    rule_version: 2026.10.12-r1
                    created_at: '2026-10-11T10:00:00.000Z'
                    updated_at: '2026-10-11T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Compositions]
      operationId: createSavedOutfit
      summary: Enregistrer une composition
      description: |
        `score` et `rule_version` sont recalculés par le serveur (valeurs du client ignorées).
        Idempotent : un `client_uuid` déjà connu renvoie 200 avec la composition existante, sans modification.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedOutfitInput'
            example:
              client_uuid: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
              title: Mariage de Léa
              composition:
                items:
                  - clothing_type_id: 13
                    color_id: 18
                    role: one_piece
                  - clothing_type_id: 17
                    color_id: 6
                    role: shoes
                occasion_slug: ceremony
                style_slug: elegant
      responses:
        '201':
          description: Composition créée.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SavedOutfit'
              example:
                data:
                  id: 2
                  client_uuid: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                  title: Mariage de Léa
                  composition:
                    items:
                      - clothing_type_id: 13
                        color_id: 18
                        role: one_piece
                      - clothing_type_id: 17
                        color_id: 6
                        role: shoes
                    occasion_slug: ceremony
                    style_slug: elegant
                  score: 90
                  rule_version: 2026.10.12-r1
                  created_at: '2026-10-12T10:00:00.000Z'
                  updated_at: '2026-10-12T10:00:00.000Z'
        '200':
          description: "Même `client_uuid` déjà enregistré : composition existante renvoyée telle quelle."
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SavedOutfit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/saved-outfits/{id}:
    parameters:
      - name: id
        in: path
        required: true
        x-proposal: true
        description: |
          Proposition de l'équipe mobile : accepte l'`id` serveur OU le `client_uuid` (insensible à la casse).
        schema:
          type: string
        example: 6a1f4c2e-3b7d-4e8a-9c0b-5d6e7f8a9b0c
    put:
      tags: [Compositions]
      operationId: updateSavedOutfit
      summary: Modifier une composition
      description: |
        Remplacement complet de `title` et `composition` (un `title` omis devient `null`) ; `score`, `rule_version`
        et `updated_at` sont recalculés. `client_uuid` n'est pas requis ici et n'est jamais modifié.
        Si `base_updated_at` est fourni et que la version serveur est plus récente, renvoie 409 `CONFLICT`
        avec la version serveur dans `current`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedOutfitUpdateInput'
            example:
              title: Entretien jeudi
              composition:
                items:
                  - clothing_type_id: 2
                    color_id: 2
                    role: top
                  - clothing_type_id: 8
                    color_id: 10
                    role: bottom
                  - clothing_type_id: 16
                    color_id: 8
                    role: shoes
                occasion_slug: work
              base_updated_at: '2026-10-11T10:00:00Z'
      responses:
        '200':
          description: Composition modifiée.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SavedOutfit'
              example:
                data:
                  id: 1
                  client_uuid: 6a1f4c2e-3b7d-4e8a-9c0b-5d6e7f8a9b0c
                  title: Entretien jeudi
                  composition:
                    items:
                      - clothing_type_id: 2
                        color_id: 2
                        role: top
                      - clothing_type_id: 8
                        color_id: 10
                        role: bottom
                    occasion_slug: work
                    style_slug: null
                  score: 95
                  rule_version: 2026.10.12-r1
                  created_at: '2026-10-11T10:00:00.000Z'
                  updated_at: '2026-10-12T10:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Composition introuvable pour cet utilisateur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Composition introuvable.
                errors: {}
                code: NOT_FOUND
        '409':
          description: Conflit de synchronisation (modifiée sur un autre appareil).
          x-proposal: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
              example:
                message: Cette composition a été modifiée sur un autre appareil.
                errors: {}
                code: CONFLICT
                current:
                  id: 1
                  client_uuid: 6a1f4c2e-3b7d-4e8a-9c0b-5d6e7f8a9b0c
                  title: Entretien jeudi
                  composition:
                    items:
                      - clothing_type_id: 2
                        color_id: 11
                        role: top
                      - clothing_type_id: 8
                        color_id: 10
                        role: bottom
                    occasion_slug: work
                    style_slug: null
                  score: 93
                  rule_version: 2026.10.12-r1
                  created_at: '2026-10-11T10:00:00.000Z'
                  updated_at: '2026-10-11T10:00:00.000Z'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Compositions]
      operationId: deleteSavedOutfit
      summary: Supprimer une composition
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Composition supprimée.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Composition introuvable pour cet utilisateur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Composition introuvable.
                errors: {}
                code: NOT_FOUND

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Jeton opaque obtenu à l'inscription ou à la connexion (`Authorization: Bearer <token>`)."

  responses:
    Unauthenticated:
      description: Jeton absent, invalide, révoqué ou expiré.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Vous devez être connecté.
            errors: {}
            code: UNAUTHENTICATED
    ValidationError:
      description: |
        Données invalides. `errors` associe chaque champ (notation pointée pour les éléments imbriqués,
        ex. `items.0.role`, `composition.items.1.color_id`) à une liste de messages.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Certaines données sont invalides.
            errors:
              color_id:
                - La couleur sélectionnée n'est pas disponible.
            code: VALIDATION_ERROR
    RateLimited:
      description: Trop de tentatives.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
          example:
            message: Trop de tentatives. Réessayez dans une minute.
            errors: {}
            code: RATE_LIMITED
            retry_after: 60

  schemas:
    Id:
      description: Identifiant ; entier quand il est numérique, chaîne sinon. Le serveur accepte les deux formes.
      oneOf:
        - type: integer
        - type: string
          minLength: 1
      examples: [1, 'abc']

    NullableId:
      oneOf:
        - $ref: '#/components/schemas/Id'
        - type: 'null'

    Error:
      type: object
      required: [message, errors, code]
      properties:
        message:
          type: string
          description: Message lisible, en français.
        errors:
          type: object
          description: Champ → liste de messages. Objet vide hors erreurs de validation.
          additionalProperties:
            type: array
            items:
              type: string
        code:
          type: string
          description: |
            Code machine. `CONFLICT` est une proposition de l'équipe mobile (synchronisation des compositions).
          enum:
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - RATE_LIMITED
            - CATALOG_UNAVAILABLE
            - INTERNAL_ERROR

    ConflictError:
      x-proposal: true
      description: "Proposition de l'équipe mobile : erreur 409 renvoyant la version serveur pour résolution du conflit."
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [current]
          properties:
            code:
              const: CONFLICT
            current:
              $ref: '#/components/schemas/SavedOutfit'

    RateLimitError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [retry_after]
          properties:
            code:
              const: RATE_LIMITED
            retry_after:
              type: integer
              minimum: 0
              description: "Proposition de l'équipe mobile : délai d'attente en secondes avant de réessayer."
              x-proposal: true
              example: 60

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    RulesMeta:
      type: object
      required: [rules_version]
      properties:
        rules_version:
          type: string
          example: 2026.10.12-r1

    PageMeta:
      type: object
      required: [current_page, per_page, total, last_page]
      properties:
        current_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
          description: Vaut 1 quand la liste est vide.

    CategoryGroup:
      type: string
      enum: [top, bottom, one_piece, shoes, accessory]

    PieceRole:
      type: string
      description: Place de la pièce dans la tenue.
      enum: [top, bottom, one_piece, shoes, accessory]

    LookStatus:
      type: string
      enum: [draft, published, archived]

    LookOrigin:
      type: string
      enum: [editorial, stylist, vendor]

    LicenseType:
      type: string
      enum: [owned, cc0, cc_by, unsplash, partner]

    PairingRuleType:
      type: string
      enum: [neutral_base, tone_on_tone, analogous, complementary, contrast, bold]

    RecommendationRuleType:
      type: string
      enum: [type_occasion, type_style]

    RemarkKind:
      type: string
      enum: [structural, style]

    BroadeningCriterion:
      type: string
      enum: [style, occasion, neighbor_shades, neutral_advice]

    UserRole:
      type: string
      enum: [user, content_admin, super_admin, stylist, vendor]

    ThemePreference:
      type: string
      enum: [system, light, dark]

    Silhouette:
      type: string
      enum: [straight, hourglass, broad]

    Language:
      type: string
      enum: [fr]

    CatalogVersion:
      type: object
      required: [catalog_version, rules_version, updated_at]
      properties:
        catalog_version:
          type: string
        rules_version:
          type: string
        updated_at:
          type: string
          format: date-time

    ClothingCategory:
      type: object
      required: [id, name, slug, group_type, is_optional, sort_order]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        slug:
          type: string
        group_type:
          $ref: '#/components/schemas/CategoryGroup'
        is_optional:
          type: boolean
          default: false
        sort_order:
          type: integer
          default: 0

    ClothingType:
      type: object
      required: [id, category_id, name, slug, is_one_piece, sort_order]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        category_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        slug:
          type: string
        is_one_piece:
          type: boolean
          default: false
        sort_order:
          type: integer
          default: 0

    CatalogColor:
      type: object
      required: [id, name, slug, hex_code, color_family, temperature, brightness, saturation, is_neutral]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        slug:
          type: string
        hex_code:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#111111'
        color_family:
          type: string
          description: Slug de la famille (cf. `ColorFamilyGuide.slug`).
        temperature:
          type: [string, 'null']
          description: "Valeurs observées : warm, cool, neutral."
        brightness:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        saturation:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        is_neutral:
          type: boolean
          default: false

    OutfitStyle:
      type: object
      required: [id, name, slug, description, sort_order]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        sort_order:
          type: integer
          default: 0

    Occasion:
      type: object
      required: [id, name, slug, description, sort_order]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        sort_order:
          type: integer
          default: 0

    ColorFamilyGuide:
      type: object
      required: [slug, name, description, is_neutral, color_ids, pairs_well_with_color_ids]
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        is_neutral:
          type: boolean
          default: false
        color_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        pairs_well_with_color_ids:
          type: array
          x-proposal: true
          description: "Proposition de l'équipe mobile : couleurs conseillées avec cette famille (vide par défaut)."
          default: []
          items:
            $ref: '#/components/schemas/Id'

    GuidePrinciple:
      type: object
      required: [slug, title, body, example_color_ids]
      properties:
        slug:
          type: string
        title:
          type: string
        body:
          type: string
        example_color_ids:
          type: array
          x-proposal: true
          description: "Proposition de l'équipe mobile : couleurs illustrant le principe (vide par défaut)."
          default: []
          items:
            $ref: '#/components/schemas/Id'

    ColorGuide:
      type: object
      required: [families, principles]
      properties:
        families:
          type: array
          items:
            $ref: '#/components/schemas/ColorFamilyGuide'
        principles:
          type: array
          items:
            $ref: '#/components/schemas/GuidePrinciple'

    ColorPairingRule:
      type: object
      x-proposal: true
      description: Proposition de l'équipe mobile (route `/color-pairing-rules`).
      required: [id, color_a_id, color_b_id, rule_type, compatibility_score, explanation, rule_version]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        color_a_id:
          $ref: '#/components/schemas/Id'
        color_b_id:
          $ref: '#/components/schemas/Id'
        rule_type:
          $ref: '#/components/schemas/PairingRuleType'
        compatibility_score:
          type: number
          description: Compatibilité de la paire (ex. 0.95).
        explanation:
          type: string
        rule_version:
          type: string

    RecommendationRule:
      type: object
      x-proposal: true
      description: Proposition de l'équipe mobile (route `/recommendation-rules`).
      required: [id, name, rule_type, conditions_json, weight, explanation, version]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        rule_type:
          $ref: '#/components/schemas/RecommendationRuleType'
        conditions_json:
          type: object
          description: |
            Conditions, valeurs textuelles. `type_slug` toujours présent, plus `occasion_slug`
            (règle `type_occasion`) ou `style_slug` (règle `type_style`).
          additionalProperties:
            type: string
          example:
            type_slug: sneakers
            occasion_slug: ceremony
        weight:
          type: number
          description: Pondération, négative pour une pénalité (ex. -0.6).
        explanation:
          type: string
          x-proposal: true
          description: "Proposition de l'équipe mobile : texte affiché à l'utilisateur quand la règle s'applique."
        version:
          type: string

    LookImage:
      type: object
      required: [id, url, thumbnail_url, source_name, source_url, license_type, attribution, usage_approved, alt_text]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        url:
          type: string
          format: uri
        thumbnail_url:
          type: [string, 'null']
          format: uri
        source_name:
          type: string
        source_url:
          type: [string, 'null']
          format: uri
        license_type:
          $ref: '#/components/schemas/LicenseType'
        attribution:
          type: [string, 'null']
          description: Crédit à afficher (obligatoire à l'affichage pour `cc_by` ou si renseigné).
        usage_approved:
          type: boolean
        alt_text:
          type: string

    LookItem:
      type: object
      required: [id, clothing_type_id, color_id, role, is_required, sort_order]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        clothing_type_id:
          $ref: '#/components/schemas/Id'
        color_id:
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/PieceRole'
        is_required:
          type: boolean
          default: true
        sort_order:
          type: integer
          default: 0

    Look:
      type: object
      required: [id, title, slug, description, style_id, occasion_id, status, published_at, origin, items, primary_image, images]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        style_id:
          $ref: '#/components/schemas/NullableId'
        occasion_id:
          $ref: '#/components/schemas/NullableId'
        status:
          $ref: '#/components/schemas/LookStatus'
        published_at:
          type: [string, 'null']
          format: date-time
        origin:
          $ref: '#/components/schemas/LookOrigin'
        items:
          type: array
          items:
            $ref: '#/components/schemas/LookItem'
        primary_image:
          oneOf:
            - $ref: '#/components/schemas/LookImage'
            - type: 'null'
        images:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/LookImage'

    RequestItem:
      type: object
      description: Pièce d'une tenue. Le `role` doit correspondre au groupe de la catégorie du type (sinon 422).
      required: [clothing_type_id, color_id, role]
      properties:
        clothing_type_id:
          $ref: '#/components/schemas/Id'
        color_id:
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/PieceRole'

    FromItemRequest:
      type: object
      required: [clothing_type_id, color_id]
      properties:
        clothing_type_id:
          $ref: '#/components/schemas/Id'
        color_id:
          $ref: '#/components/schemas/Id'
        occasion_slug:
          type: [string, 'null']
          description: Slug d'occasion existant.
        style_slug:
          type: [string, 'null']
          description: Slug de style existant.
        limit:
          type: integer
          minimum: 1
          maximum: 5
          default: 5
          description: Nombre maximal de tenues (entier JSON).

    OutfitRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/RequestItem'
        occasion_slug:
          type: [string, 'null']
          description: Slug d'occasion existant.
        style_slug:
          type: [string, 'null']
          description: Slug de style existant.

    ScoreBreakdown:
      type: object
      description: Détail du score ; la somme vaut le score total (sur 100).
      required: [color, structure, occasion, style, completeness]
      properties:
        color:
          type: integer
          minimum: 0
          maximum: 40
        structure:
          type: integer
          minimum: 0
          maximum: 25
        occasion:
          type: integer
          minimum: 0
          maximum: 15
        style:
          type: integer
          minimum: 0
          maximum: 10
        completeness:
          type: integer
          minimum: 0
          maximum: 10

    Remark:
      type: object
      required: [kind, code, message, roles]
      properties:
        kind:
          $ref: '#/components/schemas/RemarkKind'
        code:
          type: string
          description: |
            Codes émis par le simulateur : structurels `one_piece_conflict`, `missing_top`, `missing_bottom`,
            `missing_shoes`, `duplicate_role`, `duplicate_accessory` ; de style `many_accents`, `low_contrast`,
            `bold_pair`, `occasion_mismatch`, `style_mismatch`.
        message:
          type: string
        roles:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/PieceRole'

    Improvement:
      type: object
      required: [role, clothing_type_id, from_color_id, to_color_id, new_score, gain, explanation]
      properties:
        role:
          $ref: '#/components/schemas/PieceRole'
        clothing_type_id:
          $ref: '#/components/schemas/Id'
        from_color_id:
          $ref: '#/components/schemas/Id'
        to_color_id:
          $ref: '#/components/schemas/Id'
        new_score:
          type: integer
          minimum: 0
          maximum: 100
        gain:
          type: integer
        explanation:
          type: string

    RecommendedItem:
      type: object
      required: [clothing_type_id, color_id, role, is_anchor]
      properties:
        clothing_type_id:
          $ref: '#/components/schemas/Id'
        color_id:
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/PieceRole'
        is_anchor:
          type: boolean
          default: false
          x-proposal: true
          description: "Proposition de l'équipe mobile : vrai pour la pièce de départ fournie par l'utilisateur."

    RecommendedLook:
      type: object
      required: [outfit_id, title, score, breakdown, explanation, items, image]
      properties:
        outfit_id:
          $ref: '#/components/schemas/NullableId'
        title:
          type: string
          description: Titre du look, ou « Inspiré de « … » » quand la tenue est adaptée.
        score:
          type: integer
          minimum: 0
          maximum: 100
        breakdown:
          $ref: '#/components/schemas/ScoreBreakdown'
          x-proposal: true
          description: "Proposition de l'équipe mobile : détail du score par critère."
        explanation:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecommendedItem'
        image:
          description: Image principale du look, uniquement si la tenue proposée est identique au look et l'usage approuvé ; sinon `null`.
          oneOf:
            - $ref: '#/components/schemas/LookImage'
            - type: 'null'

    BroadeningStep:
      type: object
      required: [criterion, message]
      properties:
        criterion:
          $ref: '#/components/schemas/BroadeningCriterion'
        message:
          type: string

    FromItemResponse:
      type: object
      required: [request_id, catalog_version, rules_version, computed_offline, broadened, results]
      properties:
        request_id:
          type: string
          description: Identifiant à réutiliser pour le feedback.
          example: rec_000001
        catalog_version:
          type: string
        rules_version:
          type: string
        computed_offline:
          type: boolean
          default: false
          x-proposal: true
          description: "Proposition de l'équipe mobile : toujours `false` côté serveur ; `true` quand l'application calcule hors ligne."
        broadened:
          type: array
          default: []
          x-proposal: true
          description: "Proposition de l'équipe mobile : critères élargis successivement, dans l'ordre (vide si aucun)."
          items:
            $ref: '#/components/schemas/BroadeningStep'
        results:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RecommendedLook'

    EvaluationResponse:
      type: object
      required: [request_id, rules_version, computed_offline, score, breakdown, explanation, strengths, warnings, suggestions]
      properties:
        request_id:
          type: string
        rules_version:
          type: string
        computed_offline:
          type: boolean
          default: false
          x-proposal: true
          description: "Proposition de l'équipe mobile : toujours `false` côté serveur."
        score:
          type: integer
          minimum: 0
          maximum: 100
        breakdown:
          $ref: '#/components/schemas/ScoreBreakdown'
          x-proposal: true
          description: "Proposition de l'équipe mobile : détail du score par critère."
        explanation:
          type: string
        strengths:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Remark'
        suggestions:
          type: array
          maxItems: 3
          description: Vide en présence d'une remarque structurelle.
          items:
            $ref: '#/components/schemas/Improvement'

    ImprovementResponse:
      type: object
      required: [request_id, rules_version, computed_offline, current_score, improvements]
      properties:
        request_id:
          type: string
        rules_version:
          type: string
        computed_offline:
          type: boolean
          default: false
          x-proposal: true
          description: "Proposition de l'équipe mobile : toujours `false` côté serveur."
        current_score:
          type: integer
          minimum: 0
          maximum: 100
        improvements:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Improvement'

    FeedbackRequest:
      type: object
      required: [is_helpful]
      properties:
        is_helpful:
          type: boolean
        outfit_id:
          description: Look publié concerné (facultatif).
          $ref: '#/components/schemas/NullableId'
        comment:
          type: [string, 'null']
          maxLength: 500

    FeedbackReceipt:
      type: object
      required: [id, request_id, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        request_id:
          type: string
        created_at:
          type: string
          format: date-time

    AppUser:
      type: object
      required: [id, name, email, roles, email_verified_at, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        email:
          type: [string, 'null']
          format: email
        roles:
          type: array
          default: [user]
          items:
            $ref: '#/components/schemas/UserRole'
        email_verified_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    AuthSession:
      type: object
      required: [token, token_type, expires_at, user]
      properties:
        token:
          type: string
        token_type:
          type: string
          const: Bearer
          default: Bearer
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AppUser'

    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation, accepts_privacy_policy]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Nom ou pseudonyme (espaces de début et de fin retirés ; non vide).
        email:
          type: string
          format: email
          maxLength: 255
          description: Doit être unique (comparaison insensible à la casse).
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string
          description: Doit être identique à `password`.
        accepts_privacy_policy:
          type: boolean
          const: true
          x-proposal: true
          description: "Proposition de l'équipe mobile : consentement explicite à la politique de confidentialité ; doit valoir `true`."
        device_name:
          type: string
          default: mobile
          x-proposal: true
          description: "Proposition de l'équipe mobile : nom de l'appareil, pour nommer le jeton (ignoré par le simulateur)."

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 255
        device_name:
          type: string
          default: mobile
          x-proposal: true
          description: "Proposition de l'équipe mobile : nom de l'appareil, pour nommer le jeton (ignoré par le simulateur)."

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255

    ResetPasswordRequest:
      type: object
      required: [email, token, password, password_confirmation]
      properties:
        email:
          type: string
          maxLength: 255
        token:
          type: string
          maxLength: 255
          description: Jeton reçu par e-mail.
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string
          description: Doit être identique à `password`.

    UserPreferences:
      type: object
      required: [language, style_slugs, occasion_slugs, theme, silhouette, updated_at]
      properties:
        language:
          $ref: '#/components/schemas/Language'
        style_slugs:
          type: array
          items:
            type: string
        occasion_slugs:
          type: array
          items:
            type: string
        theme:
          $ref: '#/components/schemas/ThemePreference'
          x-proposal: true
          description: "Proposition de l'équipe mobile : thème de l'interface."
        silhouette:
          $ref: '#/components/schemas/Silhouette'
          x-proposal: true
          description: "Proposition de l'équipe mobile : silhouette utilisée pour les illustrations."
        updated_at:
          type: [string, 'null']
          format: date-time

    UserPreferencesInput:
      type: object
      description: Remplacement complet ; chaque champ omis prend sa valeur par défaut.
      properties:
        language:
          $ref: '#/components/schemas/Language'
          default: fr
        style_slugs:
          type: array
          default: []
          description: Slugs de styles existants (422 sur `style_slugs.N` sinon).
          items:
            type: string
        occasion_slugs:
          type: array
          default: []
          description: Slugs d'occasions existants (422 sur `occasion_slugs.N` sinon).
          items:
            type: string
        theme:
          $ref: '#/components/schemas/ThemePreference'
          default: system
          x-proposal: true
          description: "Proposition de l'équipe mobile : thème de l'interface."
        silhouette:
          $ref: '#/components/schemas/Silhouette'
          default: straight
          x-proposal: true
          description: "Proposition de l'équipe mobile : silhouette utilisée pour les illustrations."

    CompositionPayload:
      type: object
      required: [items, occasion_slug, style_slug]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestItem'
        occasion_slug:
          type: [string, 'null']
        style_slug:
          type: [string, 'null']

    CompositionInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/RequestItem'
        occasion_slug:
          type: [string, 'null']
          description: Slug d'occasion existant.
        style_slug:
          type: [string, 'null']
          description: Slug de style existant.

    LookSnapshot:
      type: object
      description: Instantané autonome d'un look, affichable sans le catalogue.
      required: [title, items, occasion_slug, style_slug, score, image_url, explanation]
      properties:
        title:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestItem'
        occasion_slug:
          type: [string, 'null']
        style_slug:
          type: [string, 'null']
        score:
          type: [integer, 'null']
        image_url:
          type: [string, 'null']
          format: uri
        explanation:
          type: [string, 'null']

    LookSnapshotInput:
      type: object
      description: Seuls `title` et `items` sont validés ; les autres champs sont stockés tels quels.
      required: [title, items]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Non vide (espaces de début et de fin retirés).
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/RequestItem'
        occasion_slug:
          type: [string, 'null']
        style_slug:
          type: [string, 'null']
        score:
          type: [integer, 'null']
        image_url:
          type: [string, 'null']
        explanation:
          type: [string, 'null']

    Favorite:
      type: object
      required: [id, client_uuid, outfit_id, snapshot, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        client_uuid:
          type: string
          format: uuid
          description: Stocké en minuscules.
        outfit_id:
          $ref: '#/components/schemas/NullableId'
        snapshot:
          $ref: '#/components/schemas/LookSnapshot'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FavoriteInput:
      type: object
      required: [client_uuid]
      anyOf:
        - required: [outfit_id]
        - required: [snapshot]
      properties:
        client_uuid:
          type: string
          format: uuid
          description: UUID généré par l'application (clé d'idempotence).
        outfit_id:
          description: Look publié (422 s'il n'existe pas ou n'est plus publié).
          $ref: '#/components/schemas/NullableId'
        snapshot:
          description: Requis si `outfit_id` est absent ; prioritaire sur l'instantané calculé à partir du look.
          $ref: '#/components/schemas/LookSnapshotInput'

    SavedOutfit:
      type: object
      required: [id, client_uuid, title, composition, score, rule_version, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        client_uuid:
          type: string
          format: uuid
        title:
          type: [string, 'null']
        composition:
          $ref: '#/components/schemas/CompositionPayload'
        score:
          type: [integer, 'null']
          description: Score calculé par le serveur avec les règles `rule_version`.
        rule_version:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SavedOutfitInput:
      type: object
      required: [client_uuid, composition]
      properties:
        client_uuid:
          type: string
          format: uuid
          description: UUID généré par l'application (clé d'idempotence).
        title:
          type: [string, 'null']
          maxLength: 120
        composition:
          $ref: '#/components/schemas/CompositionInput'
        score:
          type: [integer, 'null']
          description: Ignoré (recalculé par le serveur).
        rule_version:
          type: [string, 'null']
          description: Ignoré (fixé par le serveur).
        base_updated_at:
          type: [string, 'null']
          format: date-time
          x-proposal: true
          description: "Proposition de l'équipe mobile : validé (ISO 8601) mais sans effet à la création."

    SavedOutfitUpdateInput:
      type: object
      required: [composition]
      properties:
        title:
          type: [string, 'null']
          maxLength: 120
          description: Omis ou `null` → le titre devient `null`.
        composition:
          $ref: '#/components/schemas/CompositionInput'
        client_uuid:
          type: string
          description: Ignoré.
        score:
          type: [integer, 'null']
          description: Ignoré (recalculé par le serveur).
        rule_version:
          type: [string, 'null']
          description: Ignoré (fixé par le serveur).
        base_updated_at:
          type: [string, 'null']
          format: date-time
          x-proposal: true
          description: |
            Proposition de l'équipe mobile : `updated_at` de la version sur laquelle la modification se base.
            Si la version serveur est plus récente, 409 `CONFLICT`. Omis : pas de contrôle (dernier écrit gagne).
