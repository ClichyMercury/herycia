        - name: id
          in: path
          required: true
          x-proposal: true
          description: |
            Proposition de l'équipe mobile : accepte l'`id` serveur OU le `client_uuid` (insensible à la casse),
            pour supprimer un favori créé hors ligne avant d'en connaître l'`id`.
          schema:
            type: string
