openapi: 3.1.0
info:
  title: API Herycia (mobile) — contrat simulé
  version: 0.1.0-mock
  description: |
    Contrat de l'API REST consommée par l'application mobile Herycia, dérivé du serveur simulé
    (`lib/mock_backend`) et des exemples de `docs/api/examples`.

    Conventions :
    - Clés JSON en snake_case.
    - Identifiants : entiers quand ils sont numériques, chaînes sinon ; le serveur accepte les deux (schéma `Id`).
    - Dates : ISO 8601 en UTC (ex. `2026-10-12T10:00:00.000Z`).
    - Toute réponse réussie est enveloppée dans `{"data": ...}` ; les listes paginées ajoutent `meta` ;
      les routes de règles ajoutent `meta.rules_version`. Les réponses 204 n'ont pas de corps.
    - Les champs nullables sont toujours présents dans les réponses (valeur `null`).
    - Les erreurs suivent le schéma `Error` (`message`, `errors`, `code`).
    - Une route inconnue renvoie 404 `NOT_FOUND`.

    Les éléments marqués `x-proposal: true` ne figurent pas dans la spécification d'origine :
    ce sont des propositions de l'équipe mobile, à valider côté backend.
servers:
  - url: /api/v1
tags:
  - name: Catalogue
    description: Référentiels (catégories, types, couleurs, styles, occasions) et règles.
  - name: Looks
    description: Looks éditoriaux publiés.
  - name: Recommandations
    description: Moteur de recommandation (mode A, mode B, améliorations) et feedback.
  - name: Authentification
    description: Inscription, connexion, déconnexion et mot de passe oublié.
  - name: Compte
    description: Profil de l'utilisateur connecté.
  - name: Favoris
    description: Looks favoris synchronisés (idempotents via `client_uuid`).
  - name: Préférences
    description: Préférences de l'utilisateur.
  - name: Compositions
    description: Compositions personnelles enregistrées (idempotentes via `client_uuid`).

paths:
  /catalog/version:
    get:
      tags: [Catalogue]
      operationId: getCatalogVersion
      summary: Version du catalogue et des règles
      description: Permet à l'application de savoir si son cache local du catalogue et des règles est à jour.
      security: []
      responses:
        '200':
          description: Versions courantes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CatalogVersion'
              example:
                data:
                  catalog_version: '2026.10.12'
                  rules_version: 2026.10.12-r1
                  updated_at: '2026-10-12T08:00:00.000Z'

  /clothing-categories:
    get:
      tags: [Catalogue]
      operationId: listClothingCategories
      summary: Catégories de vêtements
      security: []
      responses:
        '200':
          description: Liste complète (non paginée).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClothingCategory'
              example:
                data:
                  - id: 1
                    name: Hauts
                    slug: top
                    group_type: top
                    is_optional: false
                    sort_order: 1
                  - id: 5
                    name: Accessoires
                    slug: accessories
                    group_type: accessory
                    is_optional: true
                    sort_order: 5

  /clothing-types:
    get:
      tags: [Catalogue]
      operationId: listClothingTypes
      summary: Types de vêtements
      description: Liste complète (non paginée), éventuellement filtrée par catégorie.
      security: []
      parameters:
        - name: category_id
          in: query
          required: false
          description: Filtre sur une catégorie. 422 si la catégorie n'existe pas.
          schema:
            $ref: '#/components/schemas/Id'
          example: 1
      responses:
        '200':
          description: Types de vêtements.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClothingType'
              example:
                data:
                  - id: 1
                    category_id: 1
                    name: T-shirt
                    slug: t-shirt
                    is_one_piece: false
                    sort_order: 1
                  - id: 2
                    category_id: 1
                    name: Chemise
                    slug: shirt
                    is_one_piece: false
                    sort_order: 2
        '422':
          $ref: '#/components/responses/ValidationError'

  /colors:
    get:
      tags: [Catalogue]
      operationId: listColors
      summary: Palette de couleurs
      security: []
      responses:
        '200':
          description: Liste complète (non paginée).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogColor'
              example:
                data:
                  - id: 1
                    name: Noir
                    slug: black
                    hex_code: '#111111'
                    color_family: black
                    temperature: neutral
                    brightness: 0.07
                    saturation: 0.0
                    is_neutral: true
                  - id: 2
                    name: Blanc
                    slug: white
                    hex_code: '#FFFFFF'
                    color_family: white
                    temperature: neutral
                    brightness: 1.0
                    saturation: 0.0
                    is_neutral: true

  /styles:
    get:
      tags: [Catalogue]
      operationId: listStyles
      summary: Styles
      security: []
      responses:
        '200':
          description: Liste complète (non paginée).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutfitStyle'
              example:
                data:
                  - id: 1
                    name: Classique
                    slug: classic
                    description: null
                    sort_order: 1
                  - id: 2
                    name: Casual
                    slug: casual
                    description: null
                    sort_order: 2

  /occasions:
    get:
      tags: [Catalogue]
      operationId: listOccasions
      summary: Occasions
      security: []
      responses:
        '200':
          description: Liste complète (non paginée).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Occasion'
              example:
                data:
                  - id: 1
                    name: Quotidien
                    slug: everyday
                    description: null
                    sort_order: 1
                  - id: 2
                    name: Travail / entretien
                    slug: work
                    description: null
                    sort_order: 2

  /color-guide:
    get:
      tags: [Catalogue]
      operationId: getColorGuide
      summary: Guide des couleurs
      description: Familles de couleurs et principes d'association, affichés dans l'écran pédagogique.
      security: []
      responses:
        '200':
          description: Guide des couleurs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ColorGuide'
              example:
                data:
                  families:
                    - slug: black
                      name: Noirs
                      description: 'La base la plus sûre : elle structure et affine.'
                      is_neutral: true
                      color_ids: [1]
                      pairs_well_with_color_ids: [2, 3]
                    - slug: white
                      name: Blancs
                      description: Lumineux et frais, ils éclairent n'importe quelle couleur.
                      is_neutral: true
                      color_ids: [2, 3]
                      pairs_well_with_color_ids: [1, 4]
                  principles:
                    - slug: neutrals
                      title: Partir des neutres
                      body: Noir, blanc, gris, beige, marine et camel s'associent avec presque tout. Ils forment une base calme sur laquelle poser une couleur.
                      example_color_ids: [10, 2]
                    - slug: light-dark
                      title: Jouer le clair et le foncé
                      body: Un contraste clair/foncé rend la tenue nette ; des valeurs proches donnent un rendu plus doux.
                      example_color_ids: [1, 3]

  /color-pairing-rules:
    get:
      tags: [Catalogue]
      operationId: listColorPairingRules
      summary: Règles d'association des couleurs
      x-proposal: true
      description: |
        Proposition de l'équipe mobile : expose les règles de compatibilité entre couleurs pour que
        l'application puisse calculer les recommandations hors ligne. Liste complète, non paginée.
      security: []
      responses:
        '200':
          description: Règles et version des règles.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ColorPairingRule'
                  meta:
                    $ref: '#/components/schemas/RulesMeta'
              example:
                data:
                  - id: 1
                    color_a_id: 1
                    color_b_id: 2
                    rule_type: contrast
                    compatibility_score: 0.95
                    explanation: 'Noir et blanc : un contraste net et intemporel.'
                    rule_version: 2026.10.12-r1
                  - id: 2
                    color_a_id: 1
                    color_b_id: 3
                    rule_type: contrast
                    compatibility_score: 0.95
                    explanation: 'Noir et blanc cassé : un contraste net et intemporel.'
                    rule_version: 2026.10.12-r1
                meta:
                  rules_version: 2026.10.12-r1

  /recommendation-rules:
    get:
      tags: [Catalogue]
      operationId: listRecommendationRules
      summary: Règles type/occasion et type/style
      x-proposal: true
      description: |
        Proposition de l'équipe mobile : expose les règles de pondération type/occasion et type/style
        pour le calcul hors ligne. Liste complète, non paginée.
      security: []
      responses:
        '200':
          description: Règles et version des règles.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecommendationRule'
                  meta:
                    $ref: '#/components/schemas/RulesMeta'
              example:
                data:
                  - id: 1
                    name: sneakers / ceremony
                    rule_type: type_occasion
                    conditions_json:
                      type_slug: sneakers
                      occasion_slug: ceremony
                    weight: -0.6
                    explanation: Les baskets sont plus décontractées que ce qu'on attend pour une cérémonie.
                    version: 2026.10.12-r1
                  - id: 2
                    name: sneakers / evening
                    rule_type: type_occasion
                    conditions_json:
                      type_slug: sneakers
                      occasion_slug: evening
                    weight: -0.3
                    explanation: Des chaussures plus habillées iraient mieux pour une soirée.
                    version: 2026.10.12-r1
                meta:
                  rules_version: 2026.10.12-r1

  /outfits:
    get:
      tags: [Looks]
      operationId: listOutfits
      summary: Looks publiés (filtrés, paginés)
      description: |
        Seuls les looks au statut `published` sont renvoyés, triés par `published_at` décroissant puis par `id` croissant.
        Une page au-delà de la dernière renvoie `data: []`.
      security: []
      parameters:
        - name: style_slug
          in: query
          required: false
          description: Filtre par style. 422 si le style n'existe pas.
          schema:
            type: string
          example: smart-casual
        - name: occasion_slug
          in: query
          required: false
          description: Filtre par occasion. 422 si l'occasion n'existe pas.
          schema:
            type: string
          example: work
        - name: page
          in: query
          required: false
          description: Numéro de page (≥ 1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          description: Taille de page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Page de looks.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Look'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
              example:
                data:
                  - id: 6
                    title: Pull camel et pantalon anthracite
                    slug: pull-camel-et-pantalon-anthracite
                    description: Des tons chauds et sobres pour l'automne au bureau.
                    style_id: 5
                    occasion_id: 2
                    status: published
                    published_at: '2026-10-07T09:00:00.000Z'
                    origin: editorial
                    items:
                      - id: 22
                        clothing_type_id: 5
                        color_id: 9
                        role: top
                        is_required: true
                        sort_order: 1
                      - id: 23
                        clothing_type_id: 8
                        color_id: 5
                        role: bottom
                        is_required: true
                        sort_order: 2
                    primary_image:
                      id: 6
                      url: https://images.herycia.example/looks/pull-camel-et-pantalon-anthracite.jpg
                      thumbnail_url: https://images.herycia.example/looks/thumbs/pull-camel-et-pantalon-anthracite.jpg
                      source_name: Unsplash
                      source_url: https://source.example/pull-camel-et-pantalon-anthracite
                      license_type: unsplash
                      attribution: 'Photo : Auteur 6 / Unsplash'
                      usage_approved: true
                      alt_text: 'Pull camel et pantalon anthracite : pull camel, pantalon gris anthracite, bottines noir, montre noir.'
                    images:
                      - id: 6
                        url: https://images.herycia.example/looks/pull-camel-et-pantalon-anthracite.jpg
                        thumbnail_url: https://images.herycia.example/looks/thumbs/pull-camel-et-pantalon-anthracite.jpg
                        source_name: Unsplash
                        source_url: https://source.example/pull-camel-et-pantalon-anthracite
                        license_type: unsplash
                        attribution: 'Photo : Auteur 6 / Unsplash'
                        usage_approved: true
                        alt_text: 'Pull camel et pantalon anthracite : pull camel, pantalon gris anthracite, bottines noir, montre noir.'
                meta:
                  current_page: 1
                  per_page: 2
                  total: 4
                  last_page: 2
        '422':
          $ref: '#/components/responses/ValidationError'

  /outfits/{id}:
    get:
      tags: [Looks]
      operationId: getOutfit
      summary: Détail d'un look publié
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant du look.
          schema:
            $ref: '#/components/schemas/Id'
          example: 1
      responses:
        '200':
          description: Look publié.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Look'
              example:
                data:
                  id: 1
                  title: Chemise bleu ciel et chino beige
                  slug: chemise-bleu-ciel-et-chino-beige
                  description: Un classique de bureau, frais et facile à porter.
                  style_id: 3
                  occasion_id: 2
                  status: published
                  published_at: '2026-10-02T09:00:00.000Z'
                  origin: editorial
                  items:
                    - id: 1
                      clothing_type_id: 2
                      color_id: 11
                      role: top
                      is_required: true
                      sort_order: 1
                    - id: 2
                      clothing_type_id: 10
                      color_id: 6
                      role: bottom
                      is_required: true
                      sort_order: 2
                  primary_image:
                    id: 1
                    url: https://images.herycia.example/looks/chemise-bleu-ciel-et-chino-beige.jpg
                    thumbnail_url: https://images.herycia.example/looks/thumbs/chemise-bleu-ciel-et-chino-beige.jpg
                    source_name: Unsplash
                    source_url: https://source.example/chemise-bleu-ciel-et-chino-beige
                    license_type: unsplash
                    attribution: 'Photo : Auteur 1 / Unsplash'
                    usage_approved: true
                    alt_text: 'Chemise bleu ciel et chino beige : chemise bleu ciel, chino beige, mocassins marron, ceinture marron, montre noir.'
                  images:
                    - id: 1
                      url: https://images.herycia.example/looks/chemise-bleu-ciel-et-chino-beige.jpg
                      thumbnail_url: https://images.herycia.example/looks/thumbs/chemise-bleu-ciel-et-chino-beige.jpg
                      source_name: Unsplash
                      source_url: https://source.example/chemise-bleu-ciel-et-chino-beige
                      license_type: unsplash
                      attribution: 'Photo : Auteur 1 / Unsplash'
                      usage_approved: true
                      alt_text: 'Chemise bleu ciel et chino beige : chemise bleu ciel, chino beige, mocassins marron, ceinture marron, montre noir.'
        '404':
          description: Look inexistant ou non publié (brouillon, archivé).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Ce look n'existe pas ou n'est plus publié.
                errors: {}
                code: NOT_FOUND

  /recommendations/from-item:
    post:
      tags: [Recommandations]
      operationId: recommendFromItem
      summary: 'Mode A : tenues à partir d''une pièce'
      description: |
        Propose jusqu'à `limit` tenues construites autour de la pièce d'ancrage, inspirées des looks publiés.
        Si les filtres ne donnent rien, le serveur élargit progressivement les critères et le signale dans `broadened`.
        Jeton facultatif : un jeton absent, invalide ou expiré est traité comme un appel anonyme (pas de 401).
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FromItemRequest'
            example:
              clothing_type_id: 2
              color_id: 11
              occasion_slug: work
              limit: 5
      responses:
        '200':
          description: Recommandations.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/FromItemResponse'
              example:
                data:
                  request_id: rec_000002
                  catalog_version: '2026.10.12'
                  rules_version: 2026.10.12-r1
                  computed_offline: false
                  broadened:
                    - criterion: style
                      message: En élargissant à tous les styles
                    - criterion: occasion
                      message: En élargissant à toutes les occasions
                  results:
                    - outfit_id: 1
                      title: Inspiré de « Chemise bleu ciel et chino beige »
                      score: 82
                      breakdown:
                        color: 35
                        structure: 25
                        occasion: 6
                        style: 6
                        completeness: 10
                      explanation: 'Beige et fuchsia : le neutre pose une base calme et valorise la couleur.'
                      items:
                        - clothing_type_id: 1
                          color_id: 19
                          role: top
                          is_anchor: true
                        - clothing_type_id: 10
                          color_id: 6
                          role: bottom
                          is_anchor: false
                      image: null
                    - outfit_id: 14
                      title: Inspiré de « Violet et anthracite »
                      score: 82
                      breakdown:
                        color: 35
                        structure: 25
                        occasion: 6
                        style: 6
                        completeness: 10
                      explanation: 'Noir et fuchsia : le neutre pose une base calme et valorise la couleur.'
                      items:
                        - clothing_type_id: 1
                          color_id: 19
                          role: top
                          is_anchor: true
                        - clothing_type_id: 8
                          color_id: 5
                          role: bottom
                          is_anchor: false
                      image: null
        '422':
          description: Données invalides (type ou couleur inconnus, slug inconnu, limit hors bornes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Certaines données sont invalides.
                errors:
                  color_id:
                    - La couleur sélectionnée n'est pas disponible.
                code: VALIDATION_ERROR

  /recommendations/evaluate-outfit:
    post:
      tags: [Recommandations]
      operationId: evaluateOutfit
      summary: 'Mode B : évaluer une tenue'
      description: |
        Note la tenue sur 100 (détail dans `breakdown`), avec points forts, remarques et jusqu'à 3 suggestions.
        En présence d'une remarque structurelle, `suggestions` est vide.
        Jeton facultatif (un jeton absent ou invalide est ignoré).
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutfitRequest'
            example:
              items:
                - clothing_type_id: 13
                  color_id: 10
                  role: one_piece
                - clothing_type_id: 9
                  color_id: 10
                  role: bottom
      responses:
        '200':
          description: Évaluation.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EvaluationResponse'
              example:
                data:
                  request_id: rec_000004
                  rules_version: 2026.10.12-r1
                  computed_offline: false
                  score: 49
                  breakdown:
                    color: 31
                    structure: 7
                    occasion: 4
                    style: 3
                    completeness: 4
                  explanation: Une robe ou une combinaison remplace déjà le haut et le bas.
                  strengths:
                    - Une base entièrement neutre, facile à accessoiriser.
                  warnings:
                    - kind: structural
                      code: one_piece_conflict
                      message: Une robe ou une combinaison remplace déjà le haut et le bas.
                      roles: [one_piece, top, bottom]
                    - kind: structural
                      code: missing_shoes
                      message: Il manque des chaussures.
                      roles: [shoes]
                  suggestions: []
        '422':
          $ref: '#/components/responses/ValidationError'

  /recommendations/improve-outfit:
    post:
      tags: [Recommandations]
      operationId: improveOutfit
      summary: Améliorations d'une tenue
      description: |
        Propose jusqu'à 5 changements de couleur (une pièce à la fois), triés par gain décroissant.
        Jeton facultatif (un jeton absent ou invalide est ignoré).
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutfitRequest'
            example:
              items:
                - clothing_type_id: 5
                  color_id: 19
                  role: top
                - clothing_type_id: 9
                  color_id: 24
                  role: bottom
                - clothing_type_id: 15
                  color_id: 20
                  role: shoes
              occasion_slug: everyday
      responses:
        '200':
          description: Améliorations proposées.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ImprovementResponse'
              example:
                data:
                  request_id: rec_000005
                  rules_version: 2026.10.12-r1
                  computed_offline: false
                  current_score: 82
                  improvements:
                    - role: bottom
                      clothing_type_id: 9
                      from_color_id: 24
                      to_color_id: 1
                      new_score: 91
                      gain: 9
                      explanation: "Jean en noir plutôt qu'en orange : +9 points."
                    - role: shoes
                      clothing_type_id: 15
                      from_color_id: 20
                      to_color_id: 2
                      new_score: 91
                      gain: 9
                      explanation: "Baskets en blanc plutôt qu'en violet : +9 points."
        '422':
          $ref: '#/components/responses/ValidationError'

  /recommendations/{id}/feedback:
    post:
      tags: [Recommandations]
      operationId: sendRecommendationFeedback
      summary: Feedback sur une recommandation
      description: |
        Enregistre l'avis de l'utilisateur sur une réponse du moteur. Jeton facultatif : s'il est valide,
        le feedback est rattaché à l'utilisateur (détaché à la suppression du compte).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: '`request_id` renvoyé par une route de recommandation.'
          schema:
            type: string
          example: rec_000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
            example:
              is_helpful: true
              outfit_id: 1
              comment: Très utile pour mon entretien.
      responses:
        '201':
          description: Feedback enregistré.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/FeedbackReceipt'
              example:
                data:
                  id: 1
                  request_id: rec_000001
                  created_at: '2026-10-12T10:00:00.000Z'
        '404':
          description: '`request_id` inconnu.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Recommandation introuvable.
                errors: {}
                code: NOT_FOUND
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/register:
    post:
      tags: [Authentification]
      operationId: register
      summary: Inscription
      description: Crée le compte et renvoie directement un jeton (validité 30 jours dans le simulateur). L'e-mail est stocké en minuscules.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Kofi
              email: kofi@example.com
              password: unmotdepasse
              password_confirmation: unmotdepasse
              accepts_privacy_policy: true
              device_name: iPhone de Kofi
      responses:
        '201':
          description: Compte créé et session ouverte.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSession'
              example:
                data:
                  token: mock_0001_2
                  token_type: Bearer
                  expires_at: '2026-11-11T10:00:00.000Z'
                  user:
                    id: 2
                    name: Kofi
                    email: kofi@example.com
                    roles: [user]
                    email_verified_at: null
                    created_at: '2026-10-12T10:00:00.000Z'
        '422':
          description: Données invalides (e-mail déjà utilisé, mot de passe trop court, politique non acceptée…).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Certaines données sont invalides.
                errors:
                  name:
                    - Le champ nom ou pseudonyme est obligatoire.
                  email:
                    - Un compte existe déjà avec cette adresse.
                  password:
                    - Le mot de passe doit contenir au moins 8 caractères.
                  accepts_privacy_policy:
                    - Vous devez accepter la politique de confidentialité.
                code: VALIDATION_ERROR

  /auth/login:
    post:
      tags: [Authentification]
      operationId: login
      summary: Connexion
      description: |
        Identifiants incorrects : 422 sur le champ `email` (pas 401).
        Après 5 échecs en moins d'une minute pour le même e-mail : 429 `RATE_LIMITED` avec `retry_after` (secondes).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: demo@herycia.app
              password: motdepasse123
              device_name: Pixel 7
      responses:
        '200':
          description: Session ouverte.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSession'
              example:
                data:
                  token: mock_0002_1
                  token_type: Bearer
                  expires_at: '2026-11-11T10:00:00.000Z'
                  user:
                    id: 1
                    name: Awa
                    email: demo@herycia.app
                    roles: [user]
                    email_verified_at: '2026-09-30T10:00:00.000Z'
                    created_at: '2026-09-30T10:00:00.000Z'
        '422':
          description: Champs manquants ou identifiants incorrects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Certaines données sont invalides.
                errors:
                  email:
                    - Ces identifiants ne correspondent à aucun compte.
                code: VALIDATION_ERROR
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Authentification]
      operationId: logout
      summary: Déconnexion
      description: Révoque le jeton utilisé pour l'appel.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Jeton révoqué.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/forgot-password:
    post:
      tags: [Authentification]
      operationId: forgotPassword
      summary: Demande de réinitialisation du mot de passe
      description: Réponse identique que le compte existe ou non (pas d'énumération des comptes).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: demo@herycia.app
      responses:
        '200':
          description: Demande prise en compte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Si un compte existe pour cette adresse, un e-mail de réinitialisation a été envoyé.
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/reset-password:
    post:
      tags: [Authentification]
      operationId: resetPassword
      summary: Réinitialisation du mot de passe
      description: |
        Change le mot de passe avec le jeton reçu par e-mail (usage unique) et révoque tous les jetons d'accès de l'utilisateur.
        Jeton invalide ou expiré : 422 sur le champ `token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              email: demo@herycia.app
              token: reset_0001
              password: nouveaumotdepasse
              password_confirmation: nouveaumotdepasse
      responses:
        '200':
          description: Mot de passe modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Votre mot de passe a été modifié.
        '422':
          $ref: '#/components/responses/ValidationError'

  /me:
    get:
      tags: [Compte]
      operationId: getMe
      summary: Profil de l'utilisateur connecté
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Utilisateur connecté.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AppUser'
              example:
                data:
                  id: 1
                  name: Awa
